services:
  backend:
    build: ./backend
    stop_grace_period: 30s
    environment:
      SCIENTIFIC_ENGINE_URL: http://scientificengine:8003
      MISSION_SCIENCE_URL: http://mission-science:8014
      ROVER_SCIENCE_URL: ${ROVER_SCIENCE_URL:-}
      RELAY_ADAPTER_URL: http://relay-adapter:8015
      DS_URL: http://ds:8001
      ML_URL: http://ml:8002
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-20s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose: ["8080"]
    depends_on:
      scientificengine: { condition: service_healthy, required: false }
      mission-science: { condition: service_healthy }
      relay-adapter: { condition: service_healthy }
      ds: { condition: service_healthy }
      ml: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
  ds:
    build: ./ds
    expose: ["8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
  ml:
    build: ./ml
    expose: ["8002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["8080:80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/mission-science.html"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      backend: { condition: service_healthy }
  scientificengine:
    profiles: ['legacy']  # needs the external INT-4 checkout; see docs/rebuild.md
    build: ./scientificengine
    init: true
    stop_grace_period: 30s
    environment:
      SKYLINE_SCIENCE_ROOT: /science
      SKYLINE_ASSET_ROOT: /science/data/raw
      SKYLINE_CACHE_ROOT: /cache
    expose: ["8003"]
    volumes:
      - type: bind
        source: ${SKYLINE_SCIENCE_ROOT:-../Nasa/scenariosandstuffs/Nasa-int4}
        target: /science
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SKYLINE_ASSET_ROOT:-../Nasa/data/raw}
        target: /science/data/raw
        read_only: true
        bind:
          create_host_path: false
      - scientificengine-cache:/cache
      - scientificengine-mission-cache:/science/data/processed/surfaceRf/demo/horizonCache
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8003/healthz', timeout=2)); assert r['missionReady']"]
      interval: 10s
      timeout: 3s
      start_period: 300s
      retries: 6

  mission-science:
    build: ./services/missionScience
    init: true
    expose: ['8014']
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8014/health',timeout=2)); assert r['kernelsPresent'] and r['terrainPresent']"]
      interval: 10s
      timeout: 4s
      retries: 6
    volumes:
      - ${SKYLINE_MISSION_ASSET_ROOT:-./services/missionScience/data/raw}:/app/data/raw:ro
      - mission-science-cache:/app/data/cache

  relay-adapter:
    build: ./services/relayAdapter
    init: true
    expose: ['8015']
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8015/health',timeout=2)); assert r['filesPresent']"]
      interval: 10s
      timeout: 4s
      retries: 6
    volumes:
      - ${SKYLINE_MISSION_ASSET_ROOT:-./services/missionScience/data/raw}:/app/data/raw:ro
      - ./services/relayAdapter/data/states:/app/data/states:ro
      - relay-adapter-cache:/app/data/cache

  rover-science:
    profiles: ['rover']
    build: ./services/missionScience
    command: ['python', '-m', 'uvicorn', 'skyline_rover_science.api:app', '--host', '0.0.0.0', '--port', '8016']
    init: true
    expose: ['8016']
    environment:
      ROVER_CACHE_ROOT: /app/data/roverCache
      ROVER_RELAY_COMPARE_URL: http://backend:8080/api/relay-engineering/compare
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8016/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    volumes:
      - ${SKYLINE_MISSION_ASSET_ROOT:-./services/missionScience/data/raw}:/app/data/raw:ro
      - rover-science-cache:/app/data/roverCache

volumes:
  rover-science-cache:
  relay-adapter-cache:
  mission-science-cache:
  scientificengine-cache:
  scientificengine-mission-cache:
