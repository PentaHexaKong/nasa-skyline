[build-system]
requires = ['setuptools>=75']
build-backend = 'setuptools.build_meta'
[project]
name = 'skyline-relay-adapter'
version = '0.1.0'
requires-python = '>=3.11'
dependencies = ['numpy>=2,<3','spiceypy>=6,<9','rasterio>=1.4,<2','pyproj>=3.6,<4','fastapi>=0.115,<1','pydantic>=2.10,<3','uvicorn>=0.30,<1']
[project.optional-dependencies]
test = ['pytest>=8,<10','httpx>=0.27,<1','jsonschema>=4,<5']
feeds = ['jsonschema>=4,<5']
[tool.pytest.ini_options]
pythonpath = ['src']
python_files = ['test*.py']
