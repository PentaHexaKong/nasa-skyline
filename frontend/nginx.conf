server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers, so redirects keep whatever host and port the browser used (8080 under compose).
    absolute_redirect off;

    location = /api/mission-science/v1/mast-power-evaluations {
        proxy_pass http://backend:8080/api/mission-science/v1/mast-power-evaluations;
        proxy_read_timeout 610s;
    }

    location = /api/mission-science/v1/mast-placement-evaluations {
        proxy_pass http://backend:8080/api/mission-science/v1/mast-placement-evaluations;
        proxy_read_timeout 610s;
    }

    location /api/mission-science/ {
        proxy_pass http://backend:8080/api/mission-science/;
        proxy_read_timeout 100s;
    }

    location /api/relay-engineering/ {
        proxy_pass http://backend:8080/api/relay-engineering/;
        proxy_read_timeout 100s;
    }

    location /api/rover-science/ {
        proxy_pass http://backend:8080/api/rover-science/;
        proxy_read_timeout 610s;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Addresses from before the 2026-11-14 restructure, kept working for shared links.
    location ~ ^/moon/?$ {
        return 301 /$is_args$args#space;
    }
    # Explore and Understand became one page at / on 2026-11-14; the scene and the lesson list are chapters of it.
    location ~ ^/explore/?$ {
        return 301 /$is_args$args#space;
    }
    location ~ ^/understand/?$ {
        return 301 /#lessons;
    }
    location ~ ^/planner/?$ {
        return 301 /analyze$is_args$args;
    }
    location ~ ^/visualize/([^/]+)/?$ {
        return 301 /analyze/$1$is_args$args;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
